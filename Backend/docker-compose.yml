services:
  redis:
    image: redis:7-alpine
    container_name: redis-for-demo-bkend
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    
  mongo:
    image: mongo:7
    container_name: mongo-for-demo-bkend
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: mydatabase

volumes:
  redis-data:
  mongo-data: